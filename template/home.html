<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คอร์สเรียนภาษาไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+Thai:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="assets/style.css">
<style>
.home{max-width:960px;margin:0 auto;padding:48px 20px 100px}
.home h1{font-size:2.2rem;margin:0 0 .2em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:28px}
.card{display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--fg);text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h2{margin:0;font-size:1.25rem}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.7;flex:1}
.card .meta{font-size:13px;color:var(--muted)}
.card .meter{flex:none;height:4px}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">คอร์สเรียน <i>·</i> ฉบับภาษาไทย</span>
  <button id="themeBtn" type="button" aria-label="เปลี่ยน theme"></button>
</div></header>
<main class="home">
  <h1>คอร์สทั้งหมด</h1>
  <p class="src">เลือกคอร์สที่จะเรียน progress ของแต่ละคอร์สเก็บแยกกันในเบราว์เซอร์นี้</p>
  <div class="cards">
{{CARDS}}
  </div>
</main>
<script>
const root = document.documentElement, themeBtn = document.getElementById('themeBtn');
const THEMES = ['auto', 'light', 'dark'], LABEL = {auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark'};
function setTheme(t){
  if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
  themeBtn.textContent = LABEL[t];
  try { t === 'auto' ? localStorage.removeItem('theme') : localStorage.setItem('theme', t); } catch (e) {}
}
setTheme(root.dataset.theme || 'auto');
themeBtn.addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf(root.dataset.theme || 'auto') + 1) % 3]));

document.querySelectorAll('.card').forEach(c => {
  let store = {};
  try { store = JSON.parse(localStorage.getItem('quiz:' + c.dataset.course) || '{}'); } catch (e) {}
  const total = +c.dataset.total, right = Object.values(store).filter(s => s.ok).length;
  c.querySelector('.meter i').style.width = (total ? right / total * 100 : 0) + '%';
  c.querySelector('.prog').textContent = `ตอบถูก ${right}/${total}`;
});
</script>
</body>
</html>
